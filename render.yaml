# Render Blueprint for KVN Ride-Booking Ecosystem
# Deploy directly by creating a Blueprint Instance at https://dashboard.render.com/blueprints

services:
  # 1. FastAPI + Socket.io Real-time Backend Web Service
  - type: web
    name: kvn-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:socket_app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "*"

  # 2. Customer Ride-Booking Frontend (Static Site)
  - type: static
    name: kvn-customer-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. KVN Captain Partner Frontend (Static Site)
  - type: static
    name: kvn-captain-frontend
    rootDir: captain-frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
